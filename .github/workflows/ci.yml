name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src rounds tests
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate community results and generated index
        run: |
          PYTHONPATH=src ./llm-hardtest results validate
          PYTHONPATH=src ./llm-hardtest results build --check
          PYTHONPATH=src ./llm-hardtest results database \
            --output "${RUNNER_TEMP}/community.sqlite3"
          PYTHONPATH=src ./llm-hardtest results database \
            --output "${RUNNER_TEMP}/community.sqlite3" --check
          PYTHONPATH=src ./llm-hardtest results catalog \
            --database "${RUNNER_TEMP}/community.sqlite3" --json
          PYTHONPATH=src ./llm-hardtest results recommend \
            --database "${RUNNER_TEMP}/community.sqlite3" --round 1 \
            --configuration 0123456789 --python-version 3.12 \
            --context-window 4096 --server-version 1.0 --json
          PYTHONPATH=src ./llm-hardtest results plan \
            --database "${RUNNER_TEMP}/community.sqlite3" --round 1 \
            --objective accuracy --objective latency --target-bundles 10 --json
          PYTHONPATH=src ./llm-hardtest results compare \
            --database "${RUNNER_TEMP}/community.sqlite3" --round 1 \
            --left-configuration 0123456789 \
            --right-configuration abcdef0123 --objective accuracy --json
          PYTHONPATH=src ./llm-hardtest results readiness \
            --database "${RUNNER_TEMP}/community.sqlite3" --round 1 \
            --objective accuracy --json
          PYTHONPATH=src ./llm-hardtest results pilots validate
          PYTHONPATH=src ./llm-hardtest results pilots build --check
      - name: Installed package smoke test
        run: |
          python -m pip install .
          cd "$(mktemp -d)"
          llm-hardtest selftest
          mkdir submissions
          llm-hardtest results database submissions --output community.sqlite3
          llm-hardtest results database submissions --output community.sqlite3 --check
          llm-hardtest results catalog --database community.sqlite3 --json
          llm-hardtest results recommend \
            --database community.sqlite3 --round 1 \
            --configuration 0123456789 --python-version 3.12 \
            --context-window 4096 --server-version 1.0 --json
          llm-hardtest results plan \
            --database community.sqlite3 --round 1 \
            --objective accuracy --objective latency --target-bundles 10 --json
          llm-hardtest results compare \
            --database community.sqlite3 --round 1 \
            --left-configuration 0123456789 \
            --right-configuration abcdef0123 --objective accuracy \
            --minimum-accuracy-effect 0.05 --json
          llm-hardtest results readiness \
            --database community.sqlite3 --round 1 \
            --objective accuracy --json
      - name: Harness self-test
        run: ./llm-hardtest selftest
      - name: Q30v2 trap proof
        run: PYTHONDONTWRITEBYTECODE=1 python rounds/round4/q30v2_policy_conflict/verify_trap.py
      - name: Q31 trap proof
        run: PYTHONDONTWRITEBYTECODE=1 python rounds/round4/q31_approval_followup/verify_trap.py
      - name: Round 5 pilot control matrix
        run: |
          PYTHONDONTWRITEBYTECODE=1 python rounds/round5/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q33_batch_delivery/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q34_config_overlay/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q35_snapshot_race/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q36_jsonl_stream/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q37_archive_boundary/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q38_webhook_replay/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q39_job_lease/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q40_ssrf_redirect/verify_pilot.py
          PYTHONDONTWRITEBYTECODE=1 python \
            rounds/round5/tasks/q41_async_fanout/verify_pilot.py
