name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q src rounds tests
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Validate community results and generated index
        run: |
          PYTHONPATH=src ./llm-hardtest results validate
          PYTHONPATH=src ./llm-hardtest results build --check
          PYTHONPATH=src ./llm-hardtest results database \
            --output "${RUNNER_TEMP}/community.sqlite3"
          PYTHONPATH=src ./llm-hardtest results database \
            --output "${RUNNER_TEMP}/community.sqlite3" --check
          PYTHONPATH=src ./llm-hardtest results recommend \
            --database "${RUNNER_TEMP}/community.sqlite3" --round 1 --json
          PYTHONPATH=src ./llm-hardtest results pilots validate
          PYTHONPATH=src ./llm-hardtest results pilots build --check
      - name: Installed package smoke test
        run: |
          python -m pip install .
          cd "$(mktemp -d)"
          llm-hardtest selftest
          mkdir submissions
          llm-hardtest results database submissions --output community.sqlite3
          llm-hardtest results database submissions --output community.sqlite3 --check
          llm-hardtest results recommend \
            --database community.sqlite3 --round 1 --json
      - name: Harness self-test
        run: ./llm-hardtest selftest
      - name: Q30v2 trap proof
        run: PYTHONDONTWRITEBYTECODE=1 python rounds/round4/q30v2_policy_conflict/verify_trap.py
      - name: Q31 trap proof
        run: PYTHONDONTWRITEBYTECODE=1 python rounds/round4/q31_approval_followup/verify_trap.py
      - name: Round 5 pilot control matrix
        run: PYTHONDONTWRITEBYTECODE=1 python rounds/round5/verify_pilot.py
